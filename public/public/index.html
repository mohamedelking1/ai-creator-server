<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Creator</title>
</head>
<body style="font-family: Arial; text-align:center; margin-top:50px;">

  <h1>AI Image Generator 🎨</h1>

  <input 
    type="text" 
    id="prompt" 
    placeholder="Write your image description..."
    style="width:70%; padding:10px;"
  />

  <br><br>

  <button onclick="generateImage()" style="padding:10px 20px;">
    Generate Image
  </button>

  <br><br>

  <div id="result"></div>

  <script>
    async function generateImage() {
      const prompt = document.getElementById("prompt").value;

      const response = await fetch("/api/generate-image", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ prompt })
      });

      const data = await response.json();

      if (data.imageUrl) {
        document.getElementById("result").innerHTML =
          `<img src="${data.imageUrl}" width="400"/>`;
      } else {
        document.getElementById("result").innerText = "Error generating image";
      }
    }
  </script>

</body>
</html>
